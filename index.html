<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prism — Daily Light Puzzle</title>
<style>
  :root{--bg:#0b1020;--panel:#141b30;--edge:#222c49;--text:#eef1ff;--sub:#97a0c0;--accent:#7c5cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center}
  .wrap{max-width:720px;margin:0 auto;padding:70px 22px 80px}
  .logo{width:104px;height:104px;margin:0 auto}
  h1{font-size:42px;margin:22px 0 6px}
  .tag{color:var(--sub);font-size:18px}
  .row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:28px}
  .feat{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:18px;max-width:200px}
  .feat b{display:block;margin-bottom:6px}
  .feat span{color:var(--sub);font-size:14px}
  .links{margin-top:40px}
  a{color:var(--accent);text-decoration:none;margin:0 10px}
  footer{margin-top:50px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <svg class="logo" viewBox="0 0 100 100"><polygon points="35,22 35,78 70,50" fill="none" stroke="#fff" stroke-width="6"/><line x1="6" y1="50" x2="33" y2="50" stroke="#fff" stroke-width="6"/><line x1="60" y1="50" x2="94" y2="28" stroke="#ff4d5e" stroke-width="6"/><line x1="62" y1="50" x2="96" y2="50" stroke="#3ddc84" stroke-width="6"/><line x1="60" y1="50" x2="94" y2="72" stroke="#4d9bff" stroke-width="6"/></svg>
  <h1>Prism</h1>
  <p class="tag">Bend light. Light every target. A new puzzle every day.</p>

  <div class="row">
    <div class="feat"><b>Daily puzzle</b><span>A fresh, hand-tuned light puzzle every day. Build your streak.</span></div>
    <div class="feat"><b>No ads</b><span>Calm, minimal design. No ads, no accounts, no clutter.</span></div>
    <div class="feat"><b>Easy to deep</b><span>Learn in seconds. Four difficulties up to Expert.</span></div>
  </div>

  <div class="links">
    <a href="/prism/support">Support</a> ·
    <a href="/prism/privacy">Privacy</a>
  </div>

  <footer>© 2026 張建堯 · Prism</footer>
</div>
</body>
</html>
